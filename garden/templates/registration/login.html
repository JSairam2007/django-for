{% load static %}
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Welcome back · PlotPal</title><link rel="stylesheet" href="{% static 'garden/styles.css' %}"></head>
<body class="auth-page"><main class="auth-card"><a class="brand auth-brand" href="{% url 'garden:login' %}"><span class="brand-mark">✳</span><span>plot<span class="brand-light">pal</span></span></a><p class="eyebrow">YOUR GARDEN IS WAITING</p><h1>Welcome back.</h1><p class="auth-copy">Sign in and see what’s growing.</p>
{% if form.errors %}<div class="form-errors">That username and password didn’t match. Please try again.</div>{% endif %}
<form method="post">{% csrf_token %}{% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}<div class="form-field"><label for="{{ form.username.id_for_label }}">Username</label><input class="form-control" id="{{ form.username.id_for_label }}" type="text" name="username" autocomplete="username" required autofocus></div><div class="form-field"><label for="{{ form.password.id_for_label }}">Password</label><input class="form-control" id="{{ form.password.id_for_label }}" type="password" name="password" autocomplete="current-password" required></div><button class="button button-primary button-full" type="submit">Let’s grow <span>→</span></button></form>
<p class="auth-switch">New around here? <a href="{% url 'garden:signup' %}">Create an account</a></p></main></body></html>
