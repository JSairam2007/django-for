databases:
  - name: plotpal-db
    plan: free
    databaseName: plotpal
    user: plotpal

services:
  - type: web
    name: plotpal
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-render.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && python manage.py seed_demo && gunicorn plotpal.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: plotpal-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
